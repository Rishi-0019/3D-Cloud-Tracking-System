<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather and 3D Cloud Tracking System</title>
</head>
<body>
    <style>body, html {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #87CEEB, #fff);
        color: #333;
        text-align: center;
    }
    
    header {
        background-color: #00897b;
        color: white;
        padding: 20px 0;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    #weather {
        margin: 50px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
    }
    
    footer {
        background-color: aquamarine;
        padding: 20px;
    }
    
    #container {
        width: 100%;
        height: 500px; /* Adjust the height as needed */
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }
    </style>
    <header>
        <h1>Weather and 3D Cloud Tracking System</h1>
    </header>
    <section id="weather">
        <form id="city-form">
            <input type="text" id="city-input" placeholder="Enter city name" required>
            <button type="submit">Get Weather</button>
        </form>
        <h2>Weather in <span id="city">...</span></h2>
        <p>Temperature: <span id="temperature">...</span> °C / <span id="temperature_f">...</span> °F</p>
        <p>Feels Like: <span id="feels_like">...</span> °C / <span id="feels_like_f">...</span> °F</p>
        <p>Humidity: <span id="humidity">...</span>%</p>
        <p>Wind Speed: <span id="wind_speed">...</span> m/s</p>
        <p>Description: <span id="description">...</span></p>
    </section>
    <div id="container"></div>
    <footer> Designed & Developed by &copy;Rishabh Tiwari </footer>
</body>
</html>
